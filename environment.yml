  - numpy=1.24.4
  - scipy=1.10.1
  - mpi4py
  - openmpi=4.1.5
  - fftw=3.3.10
  - cupy
  - cutensor
  - cudatoolkit=11.8
  - cmake
  - pkg-config
  - pip
